# Builds the production Docker image in GitHub Actions and publishes it to GHCR, so the Lightsail
# host only has to PULL a finished image instead of building one.
#
# This workflow only builds and pushes. It never touches the server: the host polls origin/main and
# pulls the matching image (scripts/deploy-from-ghcr.sh, run by cron on the host).
#
# Image:   ghcr.io/<owner>/<repo>:<full commit SHA>   immutable; the one the host deploys
#          ghcr.io/<owner>/<repo>:main                 convenience only, never deployed
# Label:   org.opencontainers.image.revision = commit SHA (the host refuses a mismatching image)
#
# Credentials: none to add. Publishing uses the workflow's own GITHUB_TOKEN with `packages: write`.
name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the (lower-case) image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # The Lightsail host is x86_64.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=justsignsindia
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # One plain single-platform image, so the host's `docker pull` gets an image whose labels
          # it can check.
          provenance: false
          sbom: false
